<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="4096" height="4096" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">CodeKeel CK monogram</title>
  <desc id="desc">A minimalist CK monogram. The open C suggests a hull and the vertical K stem extends into a keel.</desc>

  <!-- Graphite squircle: a stable container on both light and dark GitHub themes. -->
  <rect x="64" y="64" width="896" height="896" rx="224" fill="#111113"/>

  <!-- C / hull. The asymmetric open arc leaves a deliberate channel for the K. -->
  <path
    d="M688 300
       C638 254 576 230 508 230
       C350 230 230 351 230 512
       C230 673 350 794 508 794
       C584 794 650 766 702 713"
    fill="none"
    stroke="#F5F5F7"
    stroke-width="92"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- K / coding branch. The stem continues below the junction as a softly rounded keel. -->
  <path
    d="M510 312 L510 708
       M510 512 L704 326
       M510 512 L708 704"
    fill="none"
    stroke="#A1A1A6"
    stroke-width="76"
    stroke-linecap="round"
    stroke-linejoin="round"/>
</svg>
